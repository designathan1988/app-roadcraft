<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laboratório de agentes — Roadcraft</title>
  <style>
    :root { --bg: rgba(12, 25, 27, 0.86); --line: rgba(187, 235, 224, 0.18); --text: #f4fbf8; --muted: #9eb7b2; --accent: #65e5c3; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #cfdde6; font: 14px system-ui, sans-serif; color: var(--text); }
    #lab { width: 100%; height: 100%; display: block; }
    .panel { position: fixed; left: 12px; top: 12px; width: 260px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .panel h1 { font-size: 15px; margin: 0 0 10px; }
    .panel h2 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 0 6px; }
    #agents { display: flex; gap: 6px; flex-wrap: wrap; }
    .agent { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    .agent.on { border-color: var(--accent); color: var(--accent); }
    .step { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
    .step.now { border-color: var(--accent); }
    .step button { background: transparent; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; }
    .step button:hover { color: #ff8b80; }
    .empty { color: var(--muted); font-size: 13px; }
    #status { position: fixed; left: 12px; right: 12px; bottom: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--muted); font-size: 13px; }
    #menu { position: fixed; min-width: 180px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
    #menu[hidden] { display: none; }
    #menu .title { color: var(--muted); font-size: 12px; padding: 4px 8px; }
    #menu button { text-align: left; background: transparent; border: 0; color: var(--text); padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    #menu button:hover { background: rgba(101, 229, 195, 0.15); color: var(--accent); }
  </style>
</head>
<body>
  <canvas id="lab"></canvas>
  <div class="panel">
    <h1>Laboratório de agentes</h1>
    <h2>Pessoas</h2>
    <div id="agents"></div>
    <h2>Fila de ações</h2>
    <div id="queue"></div>
  </div>
  <div id="menu" hidden></div>
  <div id="status"></div>
  <script type="module" src="/src/sandbox/main.ts"></script>
</body>
</html>
